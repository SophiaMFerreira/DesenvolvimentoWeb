<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function buscaCarta(e){
         
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    resposta=JSON.parse(xhttp.responseText)
                    console.log(resposta.cards[0].image);
                    card.src=resposta.cards[0].image
                }
            };
            xhttp.open("GET", "https://deckofcardsapi.com/api/deck/l8gc4h3bkoqn/draw/?count=1", true);
            xhttp.send();
     
        }        
    </script>

</head>
<body>
    <form onsubmit="buscaCarta(event); return false">
        <input type="submit">
        <img id="card">
    </form>
</body>
</html>
